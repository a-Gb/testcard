<!DOCTYPE html>
<!--
  OBS Testcard Template
  
  URL Parameters:
  - pattern: Type of test pattern to display (smpte, rgb, pal, pretty)
  - frame: Frame style (true/default, minimal, crt, none/false)
  - banner: Custom text to show in the banner area
  
  Keyboard Controls:
  - 't': Toggle visibility of the testcard
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testcard</title>
  <link rel="stylesheet" href="assets/testcard.css">
</head>

<body>
  <div class="testcard">
    <!-- SMPTE Color Bars Pattern -->
    <div class="color-bars">
      <!-- Top color bars (75% intensity) -->
      <div class="top-bars">
        <div class="bar gray"></div>
        <div class="bar yellow"></div>
        <div class="bar cyan"></div>
        <div class="bar green"></div>
        <div class="bar magenta"></div>
        <div class="bar red"></div>
        <div class="bar blue"></div>
      </div>
        
      <!-- Castellations section -->
      <div class="castellations">
        <div class="blue-castellation"></div>
        <div class="black-castellation"></div>
        <div class="magenta-castellation"></div>
        <div class="black-castellation"></div>
        <div class="cyan-castellation"></div>
        <div class="black-castellation"></div>
        <div class="gray-castellation"></div>
      </div>
        
      <!-- Bottom section -->
      <div class="bottom-section">
        <!-- -I, white, and +Q sections -->
        <div class="bottom-left">
          <div class="i-section"></div>
          <div class="white-section"></div>
          <div class="q-section"></div>
        </div>
            
        <!-- Black reference rectangle with PLUGE bars -->
        <div class="bottom-right">
          <div class="pluge-section">
            <div class="super-black"></div>
            <div class="reference-black"></div>
            <div class="above-black"></div>
          </div>
        </div>
      </div>
    </div>
      
    <!-- Pretty Pattern Container (hidden by default) -->
    <div class="pretty-container" style="display: none;">
      <div class="row top-row">
        <div class="color-block white"></div>
        <div class="color-block yellow"></div>
        <div class="color-block light-blue"></div>
        <div class="color-block green"></div>
        <div class="color-block pink"></div>
        <div class="color-block red"></div>
        <div class="color-block orange"></div>
        <div class="color-block blue"></div>
      </div>
      <div class="middle-section">
        <div class="black-bar">
          <div class="palette">
            <div class="swatch s1-1"></div>
            <div class="swatch s1-2"></div>
            <div class="swatch s1-3"></div>
            <div class="swatch s1-4"></div>
            <div class="swatch s1-5"></div>
            <div class="swatch s1-6"></div>
          </div>
          <div class="palette">
            <div class="swatch s2-1"></div>
            <div class="swatch s2-2"></div>
            <div class="swatch s2-3"></div>
            <div class="swatch s2-4"></div>
            <div class="swatch s2-5"></div>
            <div class="swatch s2-6"></div>
          </div>
          <div class="palette">
            <div class="swatch s3-1"></div>
            <div class="swatch s3-2"></div>
            <div class="swatch s3-3"></div>
            <div class="swatch s3-4"></div>
            <div class="swatch s3-5"></div>
            <div class="swatch s3-6"></div>
          </div>
        </div>
        <div class="row middle-row-below">
          <div class="color-block mrb-1"></div>
          <div class="color-block mrb-2"></div>
          <div class="color-block mrb-3"></div>
          <div class="color-block mrb-4"></div>
          <div class="color-block mrb-5"></div>
          <div class="color-block mrb-6"></div>
          <div class="color-block mrb-7"></div>
          <div class="color-block mrb-8"></div>
        </div>
      </div>
      <div class="row bottom-row">
        <div class="color-block bottom-1"></div>
        <div class="color-block bottom-2"></div>
        <div class="color-block bottom-3"></div>
        <div class="color-block bottom-4"></div>
        <div class="color-block bottom-5"></div>
        <div class="color-block bottom-6"></div>
      </div>
    </div>

    <!-- Checkerboard Pattern Container (hidden by default) -->
    <div class="checkerboard-pattern" style="display: none;">
      <!-- Rows will be generated by JS or could be static divs -->
    </div>

    <!-- Overlay information (date, time, banner) -->
    <div class="inner">
      <p id="banner"></p>
      <p id="date"></p>
      <p id="time"></p>
    </div>
  </div>
    
  <script src="assets/testcard.js"></script>
  <script src="assets/testcard-tests.js"></script> <!-- Added test script -->
</body>
</html>
